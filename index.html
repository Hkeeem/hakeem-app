<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكيم AI - وفّر أكثر بذكاء</title>
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19 0%, #1a1f35 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تنسيق الشريط العلوي (Header) */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #4f46e5; /* لون بنفسجي */
        }

        .btn-login {
            background: linear-gradient(90deg, #4f46e5, #3b82f6);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            opacity: 0.8;
        }

        /* القسم الرئيسي (Hero Section) */
        .hero {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
            margin-top: 40px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #a1a1aa;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        h1 {
            font-size: 48px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        h1 .highlight {
            background: linear-gradient(90deg, #4f46e5, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #a1a1aa;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* صندوق البحث */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-box {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 8px;
            transition: 0.3s;
        }

        .search-box:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
        }

        .search-box input::placeholder {
            color: #52525b;
        }

        .search-btn {
            background: linear-gradient(90deg, #4f46e5, #3b82f6);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            opacity: 0.9;
        }

        /* الإحصائيات */
        .stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 60px;
        }

        .stat-item h3 {
            font-size: 32px;
            font-weight: 900;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-item p {
            color: #a1a1aa;
            font-size: 14px;
        }

        /* حاوية النتائج */
        #resultsContainer {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 50px;
        }

        /* بطاقة الكوبون */
        .coupon-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .coupon-info h4 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .coupon-info p {
            color: #a1a1aa;
            font-size: 14px;
        }

        .coupon-code {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .code-box {
            background: rgba(79, 70, 229, 0.1);
            border: 1px dashed #4f46e5;
            padding: 8px 16px;
            border-radius: 8px;
            color: #4f46e5;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
        }

        .btn-copy {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: #3b82f6;
        }

        /* رسالة عدم وجود نتائج */
        .no-results {
            text-align: center;
            color: #a1a1aa;
            padding: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo">
            حكيم <span>AI</span>
        </div>
        <button class="btn-login">دخول</button>
    </header>

    <!-- القسم الرئيسي -->
    <section class="hero">
        <div class="badge">
            <span class="dot"></span>
            أكثر من 12,000 عرض محدّث يومياً
        </div>
        <h1>
            وفّر أكثر <span class="highlight">بذكاء</span><br>
            مع مساعدك الشخصي
        </h1>
        <p class="subtitle">
            اكتشف أفضل الكوبونات، قارن الأسعار، واحصل على عروض حصرية في السعودية - كل ذلك في مكان واحد.
        </p>

        <!-- شريط البحث -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن متجر، منتج، أو عرض...">
                <button class="search-btn">ابحث</button>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div class="stats">
            <div class="stat-item">
                <h3>+2M</h3>
                <p>مستخدم سعيد</p>
            </div>
            <div class="stat-item">
                <h3>+12K</h3>
                <p>كوبون نشط</p>
            </div>
            <div class="stat-item">
                <h3>+500</h3>
                <p>متجر شريك</p>
            </div>
        </div>
    </section>

    <!-- حاوية عرض النتائج -->
    <div id="resultsContainer"></div>

    <!-- كود الجافاسكريبت -->
    <script>
        // 1. بيانات تجريبية للكوبونات (يمكنك إضافة المزيد هنا)
        const coupons = [
            { id: 1, store: "نون", discount: "خصم 15% على الإلكترونيات", code: "NOON15" },
            { id: 2, store: "أمازون", discount: "خصم 10% للعملاء الجدد", code: "AMZ10" },
            { id: 3, store: "جرير", discount: "توصيل مجاني للطلبات فوق 200 ريال", code: "JARIR" },
            { id: 4, store: "نون", discount: "خصم 20% على الأزياء", code: "FASHION20" },
            { id: 5, store: "إكسترا", discount: "خصم 50 ريال عند الشراء بـ 500 ريال", code: "EXTRA50" },
            { id: 6, store: "أمازون", discount: "خصم 5% على البقالة", code: "GROCERY5" }
        ];

        // 2. جلب العناصر من الصفحة
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        // 3. دالة عرض النتائج
        function displayResults(data) {
            resultsContainer.innerHTML = ''; // تفريغ الحاوية أولاً

            if (data.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة لبحثك 😔</div>';
                return;
            }

            // إنشاء بطاقة لكل كوبون
            data.forEach(coupon => {
                const card = document.createElement('div');
                card.className = 'coupon-card';
                card.innerHTML = `
                    <div class="coupon-info">
                        <h4>${coupon.store}</h4>
                        <p>${coupon.discount}</p>
                    </div>
                    <div class="coupon-code">
                        <div class="code-box">${coupon.code}</div>
                        <button class="btn-copy" onclick="copyCode('${coupon.code}', this)">نسخ</button>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // 4. دالة نسخ الكود
        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'تم النسخ!';
                btn.style.background = '#10b981'; // لون أخضر
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#4f46e5'; // العودة للون الأصلي
                }, 2000);
            });
        }

        // 5. مستمع الحدث للبحث
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            // إذا كان البحث فارغاً، امسح النتائج
            if (searchTerm === '') {
                resultsContainer.innerHTML = '';
                return;
            }

            // فلترة الكوبونات بناءً على اسم المتجر أو الوصف
            const filteredCoupons = coupons.filter(coupon => 
                coupon.store.toLowerCase().includes(searchTerm) || 
                coupon.discount.toLowerCase().includes(searchTerm)
            );

            displayResults(filteredCoupons);
        });
    </script>

</body>
</html>
